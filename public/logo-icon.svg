<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for visual depth -->
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2906E" />
      <stop offset="60%" stop-color="#D46038" />
      <stop offset="100%" stop-color="#BE512B" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect width="512" height="512" rx="140" fill="url(#clayGrad)"/>
  
  <!-- Outer glowing rim -->
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="#F5F2EB" stroke-width="8" stroke-opacity="0.15"/>

  <!-- Creative background frames overlapping -->
  <rect x="144" y="128" width="232" height="232" rx="36" fill="none" stroke="#F5F2EB" stroke-opacity="0.25" stroke-width="12" transform="rotate(-6 256 256)"/>
  
  <!-- Styled Camera Focus Brackets / Backdrop Border -->
  <rect x="128" y="128" width="256" height="256" rx="42" fill="none" stroke="#F5F2EB" stroke-width="24"/>
  
  <!-- Camera Lens Shutter aperture -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#F5F2EB" stroke-width="16" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="28" fill="#F5F2EB"/>

  <!-- Dynamic aesthetic corners indicator -->
  <path d="M176 208v-32h32M304 176h32v32M336 304v32h-32M208 336h-32v-32" stroke="#F5F2EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
